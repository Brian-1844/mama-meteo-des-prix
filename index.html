<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Māmā · la météo des prix</title>
  <meta name="description" content="La météo des prix en Polynésie française : où fait-il beau sur le caddie ?">
  <meta name="theme-color" content="#6FE7DA">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icone.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="entete">
      <a class="logo" href="#/" aria-label="Māmā, retour à la météo du jour">
        <span id="logo-tiare"></span>
        <span class="logo-nom">māmā</span>
      </a>
      <button id="maj" class="bouton bouton-maj" type="button">
        <svg class="maj-icone" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.900"></path><path d="M20 3v5h-5"></path></svg>
        <span>Mise à jour</span>
      </button>
    </header>

    <p id="maj-date" class="maj-date" aria-live="polite"></p>

    <main id="vue" class="vue" tabindex="-1"></main>

    <nav class="onglets" aria-label="Navigation principale">
      <a href="#/" data-onglet="meteo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2"></path></svg>
        <span>Météo</span>
      </a>
      <a href="#/communes" data-onglet="communes">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>
        <span>Communes</span>
      </a>
      <a href="#/panier" data-onglet="panier">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16l-1.500 10h-13z"></path><path d="M8 9l4-5 4 5"></path></svg>
        <span>Mon panier</span>
      </a>
      <a href="#/signaler" data-onglet="signaler">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.500"></circle></svg>
        <span>Signaler</span>
      </a>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="js/secours.js"></script>
  <script src="js/icones.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
