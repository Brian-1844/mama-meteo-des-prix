<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Māmā · les promos du fenua</title>
  <meta name="description" content="Les promotions des commerces de Polynésie française, publiées par les commerçants.">
  <meta name="theme-color" content="#6FE7DA">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="entete">
      <a class="logo" href="#/" aria-label="Māmā, retour aux promos">
        <span id="logo-tiare"></span>
        <span class="logo-nom">māmā</span>
      </a>
      <button id="maj" class="bouton bouton-maj" type="button">
        <svg class="maj-icone" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.900"></path><path d="M20 3v5h-5"></path></svg>
        <span>Mise à jour</span>
      </button>
    </header>

    <p id="maj-date" class="maj-date" aria-live="polite"></p>

    <main id="vue" class="vue" tabindex="-1"></main>

    <nav class="onglets" aria-label="Navigation principale">
      <a href="#/" data-onglet="promos">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.500" cy="8.500" r="1.500"></circle></svg>
        <span>Promos</span>
      </a>
      <a href="#/commerces" data-onglet="commerces">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l2-6h14l2 6z"></path><path d="M4 10v10h16V10"></path><path d="M10 20v-6h4v6"></path></svg>
        <span>Commerces</span>
      </a>
      <a href="#/espace" data-onglet="espace">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
        <span>Mon commerce</span>
      </a>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="icones.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
